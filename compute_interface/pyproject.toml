[project]
name = "compute-interface"
version = "0.2.0"
description = "Client for compute servers built on compute-server-base — the consumer half of the same protocol"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
# Matches compute-server-base rather than the repo's usual 3.12, so the two
# halves of one protocol can never be blocked from living in one environment.
requires-python = ">=3.10"
authors = [
    { name = "Tripp Robinson", email = "trippr5118@tamu.edu" },
]
dependencies = [
    "httpx>=0.27",
    # The live log stream. httpx does not speak WebSocket, and there is no
    # polling fallback — /jobs/{id}/stream is the only way to read a job's
    # output before it finishes.
    "websockets>=13",
]

[project.optional-dependencies]
# The MCP session helper only. Left out of the base install because a REST
# consumer — matflow's relax node, a generated campaign — has no use for it,
# and `mcp` pulls a server stack in with it.
mcp = ["mcp>=2.0,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["compute_interface"]
